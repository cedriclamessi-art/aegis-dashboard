services:
  - type: web
    name: aegis-connect
    runtime: docker
    repo: https://github.com/cedriclamessi-art/aegis-dashboard
    branch: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: llama-3.1-70b-versatile
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_AD_ACCOUNT_ID
        sync: false
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: DATABASE_PATH
        value: /data/aegis.db
    disk:
      name: aegis-data
      mountPath: /data
      sizeGB: 1
